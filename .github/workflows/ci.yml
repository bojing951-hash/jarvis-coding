name: ci
on:
  push:
    branches: ['fix/**', 'dev/**']
  pull_request:
    branches: [main, 'dev/**']

permissions:
  contents: read

jobs:
  # 契约完整性独立成 job：不再依赖测试结果，也不会因测试失败而被 skip。
  contract:
    name: contract integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: verify frozen contract
        run: node scripts/verify-contract.mjs

  test:
    name: unit + fault-injection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: environment
        run: |
          node --version
          npm --version
          uname -a
      - name: unit + fault-injection tests
        run: node --test orchestrator/test/*.test.mjs
