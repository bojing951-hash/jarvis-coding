name: ci
on:
  push:
    branches: ['fix/**', 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: unit + fault-injection tests
        run: node --test orchestrator/test/*.test.mjs
      - name: contract integrity
        run: |
          test "$(wc -c < docs/contracts/p0-sec-01-ac-v1.0.md)" = "21297"
          test "$(sha256sum docs/contracts/p0-sec-01-ac-v1.0.md | cut -d' ' -f1)" = "af15737713c554509612d8296aee148387649f0ebf8b0644d933ecf8b40691b0"
